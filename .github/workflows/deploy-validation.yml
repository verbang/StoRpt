name: Docker image validation

# Builds the single StoRpt image and runs smoke checks against it. Treated as a
# release blocker per README: a failing run means the image cannot be shipped.
#
# The Dockerfile builds from committed lock files. If they are missing (first
# run, or a manifest bump not yet re-locked) this workflow regenerates them
# in-place on the runner so the Dockerfile build stays reproducible. Maintainers
# are expected to commit regenerated locks via the separate generate-locks.yml.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/deploy-validation.yml"
      - ".github/workflows/generate-locks.yml"
      - "deploy/**"
      - "backend/**"
      - "frontend/**"
      - "excel-worker/**"
  pull_request:
    paths:
      - ".github/workflows/deploy-validation.yml"
      - ".github/workflows/generate-locks.yml"
      - "deploy/**"
      - "backend/**"
      - "frontend/**"
      - "excel-worker/**"

permissions:
  contents: read

jobs:
  image-smoke:
    name: Build image and smoke test (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate requirements.lock if missing
        if: ${{ hashFiles('backend/requirements.lock') == '' }}
        working-directory: backend
        run: |
          python -m pip install --disable-pip-version-check pip-tools
          pip-compile --quiet --generate-hashes --resolver-version backtracking \
            --output-file requirements.lock pyproject.toml

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Generate package-lock.json if missing
        if: ${{ hashFiles('frontend/package-lock.json') == '' }}
        working-directory: frontend
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Build image
        run: docker build -f deploy/Dockerfile -t storpt:ci .

      - name: Generate demo auth env
        id: auth
        # A throwaway password hash + signing secret so the container starts.
        # They never leave the runner and are not used to access real data.
        run: |
          python - <<'PY'
          import base64, hashlib, secrets, os
          pw = secrets.token_urlsafe(16)
          salt = secrets.token_bytes(16)
          n, r, p, dklen = 2**14, 8, 1, 32
          digest = hashlib.scrypt(pw.encode(), salt=salt, n=n, r=r, p=p, dklen=dklen)
          def enc(b): return base64.urlsafe_b64encode(b).rstrip(b'=').decode()
          enc_hash = f"scrypt${n}${r}${p}${enc(salt)}${enc(digest)}"
          secret = secrets.token_urlsafe(48)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"hash={enc_hash}\n")
              fh.write(f"secret={secret}\n")
          PY

      - name: Run image
        run: |
          cid=$(docker run --rm -d -p 8000:8000 \
            -e STORPT_PASSWORD_HASH='${{ steps.auth.outputs.hash }}' \
            -e STORPT_SESSION_SECRET='${{ steps.auth.outputs.secret }}' \
            storpt:ci)
          echo "$cid" > /tmp/storpt-cid

      - name: Wait for health
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8000/healthz >/dev/null; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::container did not become healthy"
          docker logs "$(cat /tmp/storpt-cid)"
          exit 1

      - name: Smoke test healthz
        run: |
          set -eu
          curl -sf http://127.0.0.1:8000/healthz | grep -q '"status":"ok"'

      - name: Smoke test auth guard
        # Unguarded access must be rejected with AUTH-001; proves require_session
        # and the structured error catalog survive the container wiring.
        run: |
          set -eu
          code=$(curl -s -o /tmp/body.json -w '%{http_code}' http://127.0.0.1:8000/api/auth/session)
          [ "$code" = "401" ]
          grep -q '"code":"AUTH-001"' /tmp/body.json

      - name: Smoke test SPA index
        # Root URL must serve the compiled frontend, proving StaticFiles mount.
        run: |
          set -eu
          curl -sf http://127.0.0.1:8000/ | grep -qi '<title>StoRpt</title>'

      - name: Dump container logs on failure
        if: failure()
        run: docker logs "$(cat /tmp/storpt-cid)" || true

      - name: Stop container
        if: always()
        run: docker stop "$(cat /tmp/storpt-cid)" || true
