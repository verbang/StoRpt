name: FastAPI backend validation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/backend-validation.yml"
      - "backend/**"
      - "contracts/**"
  pull_request:
    paths:
      - ".github/workflows/backend-validation.yml"
      - "backend/**"
      - "contracts/**"

permissions:
  contents: read

jobs:
  backend:
    name: FastAPI and Worker orchestration (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend test dependencies
        run: python -m pip install --disable-pip-version-check "./backend[test]"
      - name: Run backend tests
        run: python -m pytest backend/tests
      - name: Validate Python syntax
        run: python -m compileall -q backend/storpt_api
