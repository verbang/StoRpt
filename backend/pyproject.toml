[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "storpt-backend"
version = "0.1.0"
description = "StoRpt FastAPI orchestration service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  # IANA timezone database for service._process, which stamps the download
  # filename with Asia/Shanghai (AC-044). python:3.12-slim and Windows have no
  # system tz database, so the package must ship with the image; without it
  # ZoneInfo('Asia/Shanghai') raises ZoneInfoNotFoundError and the task fails.
  "tzdata>=2024.2",
  # AKShare is required by the default AkshareMarketDataProvider wired in
  # main.create_app; the single production image must ship it. It stays out of
  # the [test] extra so unit tests run without the heavy pandas/network stack.
  "akshare>=1.17,<2",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
